*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0f1a12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}

.btn.big{width:100%;padding:13px;font-size:15px;margin-top:6px}
.sub{font-size:12px;color:#9fb8a7;line-height:1.4}
.sec{font-size:12px;font-weight:900;color:#facc15;margin:14px 0 7px;letter-spacing:.5px;text-transform:uppercase}

#loading small{font-size:13px;color:#9fb8a7}
</style>

  merchUp: d => { const m = MERCH.find(x => x.k === d.k), lv = S.merch[d.k] || 0, cost = lv === 0 ? m.unlock : Math.round((m.unlock || 15000) * 2.2 ** lv); if (!m || lv >= 5 || !spend(cost)) return; S.merch[d.k] = lv + 1; toast(`${m.i} ${m.n} agora no nível ${lv + 1}!`); render(); },
  commUp: d => { const cm = COMMERCE.find(x => x.k === d.k), lv = S.comm[d.k] || 0, cost = commPrice(cm, lv, 0); if (!cm || lv >= 5 || !spend(cost)) return; S.comm[d.k] = lv + 1; refreshHubDecor(); toast(`${cm.i} ${cm.n} agora no nível ${lv + 1}!`); render(); },
  basePromote: () => { const i = UI.club, c = S.clubs[i], bc = c.baseCand; if (!bc) return; if (c.squad.length >= SQUAD) { toast('Elenco cheio! Venda um jogador ou venda a promessa.'); return; } c.squad.push(bc); c.baseCand = null; markDirty(i); toast(`🌱 ${bc.name} subiu para o profissional!`); render(); },
  baseSell: () => { const i = UI.club, c = S.clubs[i], bc = c.baseCand; if (!bc) return; const comm = Math.round(playerPrice(bc.stars) * 0.6); addMoney(comm, i); c.baseCand = null; toast(`💰 ${bc.name} vendido da base por ${fmt(comm)}!`); render(); },
  sellClub: d => {
    const i = UI.club, c = S.clubs[i]; if (!c) return;
    const saleVal = clubSaleValue(i), royalVal = Math.round(saleVal * 0.65), royalIps = Math.round(clubTotalIps(i) * 0.2);
    if (d.mode === 'royalty') { addMoney(royalVal); S.royalties.push({ name: c.name, ips: royalIps }); toast(`🤝 ${c.name} vendido por ${fmt(royalVal)} + ${fmt(royalIps)}/s!`); }
    else { addMoney(saleVal); toast(`💵 ${c.name} vendido por ${fmt(saleVal)}!`); }
    if (RT[i] && RT[i].g) { world.remove(RT[i].g); } RT.splice(i, 1); S.clubs.splice(i, 1);
    UI.club = Math.max(0, Math.min(UI.club, S.clubs.length - 1)); relayout(); closePanel(); save();
  },
  fanUp: d => { const i = UI.club, c = S.clubs[i], f = FANS.find(x => x.k === d.k), l = c.fans[f.k]; if (l >= f.max || !spend(fanPrice(f, l, i))) return; c.fans[f.k] = l + 1; crowdBuild(i); emit('fans'); toast(`${f.i} ${f.n} melhorada!`); if (f.k === 'rojoes') fireworks(i, 6); if (f.k === 'mosaico') { setMosaic(i, true); RT[i].mosaicT = 6; } render(); },
  buyItem: d => { const c = S.clubs[UI.club]; if (!spend(+d.c)) return; c.pantry[d.k] += +d.n; emit('buy'); toast(`🛒 +${d.n} ${PANTRY.find(x => x.k === d.k).n.toLowerCase()} no CT do ${c.name}`); render(); },
  refill: d => { const i = UI.club, mt = S.clubs[i].eq[d.k], cost = refillCost(mt, i); if (!spend(cost)) return; mt.stock = 100; toast('📦 Estoque reposto!'); render(); },
  eqUp: d => { const i = UI.club, mt = S.clubs[i].eq[d.k]; if (mt.lvl >= 5 || !spend(upCost(EQ_BASE, mt.lvl) * cMul(i))) return; mt.lvl += 0.5; mt.stock = 100; render(); },
  nextClub: () => { closePanel(); plotAction(S.clubs.length); },
  ed: d => { const [a, b] = d.f.split('.'); UI.draft[a][b] = d.v; if (UI.p === 'found') { const n = $('fName'), ab = $('fAbbr'); if (n) UI.draft.name = n.value; if (ab) UI.draft.abbr = ab.value.toUpperCase(); } render(); },
  shopClub: d => { UI.club = +d.i; UI.draft = null; render(); },
  shopSave: () => { const i = UI.club, c = S.clubs[i]; c.crest = { ...UI.draft.crest }; c.kit = { ...UI.draft.kit }; buildUnit(i); rebuildObst(); emit('custom'); toast('👕 Visual salvo! Os jogadores já estão de uniforme novo.'); closePanel(); },
  found: () => {
    const i = UI.foundIdx, d = UI.draft; d.name = ($('fName').value || '').trim(); d.abbr = ($('fAbbr').value || '').trim().toUpperCase();
    if (d.name.length < 2) { toast('✏️ Dê um nome ao clube'); return; } if (!d.abbr) d.abbr = d.name.replace(/[^A-Za-zÀ-ú]/g, '').slice(0, 3).toUpperCase();
    if (!spend(clubPrice(i))) return; S.clubs.push(newClub(d)); relayout();
    report(i, `🎉 Você fundou o ${d.name}!`); toast(`🎉 ${d.name} fundado! Agora contrate os jogadores no escritório.`); emit('custom'); closePanel(); save();
  },
  noop: () => { }, charEvo: () => { const nx = EVOS[evoLv() + 1]; if (!nx || !evoReady() || !spend(nx.cost)) return; S.char.lv = evoLv() + 1; rebuildPlayer(); toast(`${nx.i} Evoluiu para ${nx.n}!`); render(); },
  charSet: d => { S.char[d.f] = d.v; rebuildPlayer(); render(); }, charShades: () => { S.char.shades = !S.char.shades; rebuildPlayer(); render(); },
  claim: d => { const m = S.missions.list[+d.k]; if (!m || m.claimed || m.prog < m.target) return; m.claimed = true; addMoney(m.reward); toast(`🎯 Missão concluída! +${fmt(m.reward)}`); updBadge(); render(); },
  reset: () => { if (!resetArm) { resetArm = true; render(); setTimeout(() => { resetArm = false; }, 4000); return; } window.__noSave = true; try { localStorage.removeItem(SAVE_KEY); } catch (e) { } location.reload(); },
  collect: () => { addMoney(UI.offGain); floatAt(player.x, 2, player.z, '+' + fmt(UI.offGain)); UI.offGain = 0; close2(); save(); },
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset); });
for (const id of ['M', 'M2']) $(id).addEventListener('click', e => { if (e.target.id === id) { id === 'M' ? closePanel() : close2(); } });
document.addEventListener('input', e => { if (UI.p === 'found' && UI.draft) { if (e.target.id === 'fName') UI.draft.name = e.target.value; if (e.target.id === 'fAbbr') { UI.draft.abbr = e.target.value.toUpperCase(); $('crestPrev').innerHTML = crestSVG(UI.draft.crest, UI.draft.abbr || 'FC', 80); } } });

// ============================ LAYOUT / OFFLINE ============================
let plotState = null;
function refreshPlot() { const n = S.clubs.length; for (let k = 0; k < RT.length; k++) if (RT[k] && RT[k].plot && k !== n) { world.remove(RT[k].plot); RT[k].plot = null; } clearPads('plot'); if (n >= MAX_CLUBS) return; const R = RT[n] = RT[n] || {}; if (R.plot) world.remove(R.plot); R.plot = buildPlot(n); plotState = canBuyNext(); pruneTargets(); }
function relayout() { S.clubs.forEach((c, i) => { RT[i] = RT[i] || {}; RT[i].lu = null; buildUnit(i); }); refreshPlot(); rebuildObst(); refreshHubDecor(); pruneTargets(); }
function offlineGain(sec) {
  sec = Math.min(sec, OFFLINE_CAP); let gain = 0;
  S.clubs.forEach((c, i) => { const sp = c.scouts.length ? c.scoutPct : 0; let ips = sponsorIps(i); if (c.staff.treinador && getLU(i).full) { const cycle = MATCH_SEC + 20 + 22 / regen(c); ips += (ticketIncome(i) + clubV(i) * 12) / cycle; } ips *= OFFLINE_RATE; gain += ips * (1 - sp) * sec; c.scoutBudget += ips * sp * sec; c.energy = 100; });
  return gain;
}
function showOffline(sec) {
  const g = offlineGain(sec); if (g < 1) return; UI.offGain = (UI.offGain || 0) + g; const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  open2(() => head('🌙 Bem-vindo de volta, presidente!', 'collect') + `<div class="sub" style="text-align:center">Você ficou fora por ${h ? h + 'h ' : ''}${m}min. Seus clubes faturaram ${OFFLINE_RATE * 100}% do normal${sec > OFFLINE_CAP ? ' (limite de 12h)' : ''} e o elenco descansou.</div><div style="text-align:center;font-size:30px;font-weight:900;color:#86efac;margin:16px 0">+${fmt(UI.offGain)}</div>${btn('💰 Coletar', 'collect', null, '', 'big gold')}`);
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) { hiddenAt = Date.now(); save(); } else if (hiddenAt) { const away = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; if (away > 30) showOffline(away); } });
addEventListener('pagehide', save);

// ============================ LOOP ============================
let last = performance.now(), saveT = 0, hudT = 0, liveT = 0, wT = 0;
function hud() {
  $('money').textContent = '💵 ' + fmt(S.money); $('ips').textContent = '+' + fmt(totalIps()) + '/s';
  const ts = tutStep(), hint = $('hint'); if (ts && !UI.p) { hint.style.display = 'block'; hint.textContent = ts.t; arrow.visible = true; arrow.position.set(ts.x, 2.6 + Math.sin(performance.now() / 250) * 0.25, ts.z); } else { hint.style.display = 'none'; arrow.visible = false; }
  updBadge();
}
function update(dt) {
  wT += dt; updPlayer(dt);
  S.clubs.forEach((c, i) => { const ips = sponsorIps(i), sp = c.scouts.length ? c.scoutPct : 0; if (ips) { addMoney(ips * (1 - sp) * dt, i); c.scoutBudget += ips * sp * dt; } refreshSquad(i); clubTick(i, dt); updMatch(i, dt); updWalkers(i, dt); updComplaints(i, dt); });
  const extraIps = commIps() + royaltyIps(); if (extraIps) addMoney(extraIps * dt);
  updScouts(dt); updFans(dt); updMerchSales(dt); updFireworks(dt); updWaves(wT);
  for (const kd of kids) { const nx = kd.bx + Math.sin(wT * 1.4 + kd.ph) * 1.6, nz = kd.bz + Math.cos(wT * 1.1 + kd.ph) * 1.2; kd.p.root.rotation.y = Math.atan2(nx - kd.p.root.position.x, nz - kd.p.root.position.z); kd.p.root.position.set(nx, 0, nz); animP(kd.p, 'run', dt); }
  updFloats(dt / FAST);
  hudT -= dt; if (hudT <= 0) { hudT = 0.2; hud(); if (canBuyNext() !== plotState) refreshPlot(); evoCheck(); }
  liveT -= dt / FAST; if (liveT <= 0) { liveT = 1; if ((UI.p === 'stadium' && UI.tab === 'partida') || (UI.p === 'office' && UI.tab === 'olheiros') || (UI.p === 'ct' && (UI.tab === 'treino' || UI.tab === 'instalacoes')) || UI.p === 'boulevard') render(); }
  saveT -= dt; if (saveT <= 0) { saveT = 5; ensureMissions(); save(); }
}
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000) * FAST; last = now; const n = Math.max(1, Math.ceil(dt / 0.05)); for (let k = 0; k < n; k++) update(dt / n); renderer.render(scene, camera); requestAnimationFrame(loop); }

// ============================ INÍCIO ============================
buildWorld();
makePad(HUB.office.x, HUB.office.z + HUB.office.d / 2 + 1.6, ['Presidência'], '#38bdf8', () => openPanel('office'), 'office');
makePad(HUB.shop.x, HUB.shop.z + HUB.shop.d / 2 + 1.8, ['Loja Oficial'], '#facc15', () => openPanel('shop'), 'shop');
makePad(HUB.boulevard.x, HUB.boulevard.z + HUB.boulevard.d / 2 + 2.2, ['Alameda'], '#22c55e', () => openPanel('boulevard'), 'boulevard');
rebuildPlayer(); relayout(); camT.set(player.x, 0, player.z); resize(); drawZoom(); ensureMissions(); hud();
$('loading').remove();
if (hadSave) { const away = (Date.now() - S.lastSave) / 1000; if (away > 30) showOffline(away); }
else toast('💼 Bem-vindo! Você tem R$ 1 mi para montar seu primeiro clube.');
requestAnimationFrame(loop);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
window.__fanNow = () => { fanT = 0; }; window.__S = () => S; window.__RT = RT; window.__ACT = ACT; window.__tap = tapAt; window.__player = () => player; window.__relayout = relayout;
</script>
